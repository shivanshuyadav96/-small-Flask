<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quick Note</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #23201c;
    --muted: #8a837a;
    --line: #e6e1d8;
    --accent: #2f6f4f;
    --accent-dark: #245740;
    --danger: #b4402f;
    --shadow: 0 1px 2px rgba(35, 32, 28, .06), 0 8px 24px rgba(35, 32, 28, .06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.55;
    padding: 40px 20px 80px;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  header { margin-bottom: 24px; }

  h1 {
    font-size: 30px;
    line-height: 1.2;
    margin: 0 0 6px;
    letter-spacing: -0.4px;
  }

  .sub { color: var(--muted); font-size: 15px; margin: 0; }

  .composer {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px;
  }

  textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: #fdfcfa;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47, 111, 79, .12);
    background: #fff;
  }

  .composer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
  }

  .counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .counter.over { color: var(--danger); font-weight: 600; }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 9px;
    border: 1px solid transparent;
    transition: background .15s, color .15s, border-color .15s, opacity .15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    padding: 9px 20px;
    font-size: 15px;
    font-weight: 600;
  }

  .btn-primary:hover:not(:disabled) { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
    padding: 5px 11px;
    font-size: 13px;
  }

  .btn-ghost:hover { color: var(--ink); border-color: #cfc8bc; }
  .btn-ghost.danger:hover { color: var(--danger); border-color: #e3bdb6; }

  .hint { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }

  .list-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 34px 2px 12px;
  }

  .list-head h2 {
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    font-weight: 700;
  }

  #count { font-size: 13px; color: var(--muted); }

  ul.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

  li.note {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    animation: rise .18s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }

  .note-text {
    margin: 0 0 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 15px;
  }

  .note-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px dashed var(--line);
    padding-top: 9px;
  }

  .stamp { font-size: 12px; color: var(--muted); }
  .note-actions { display: flex; gap: 6px; }

  .empty {
    border: 1px dashed #d9d2c6;
    border-radius: 12px;
    padding: 34px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    background: rgba(255, 255, 255, .45);
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 20px);
    background: #2a2723;
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    max-width: 90vw;
    text-align: center;
  }

  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.error { background: var(--danger); }

  @media (max-width: 520px) {
    body { padding: 26px 14px 70px; }
    h1 { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Quick Note</h1>
    <p class="sub">Type a note, save it, and it is stored in the database for good.</p>
  </header>

  <form class="composer" id="form" autocomplete="off">
    <textarea
      id="content"
      placeholder="What is on your mind?"
      maxlength="{{ max_length }}"
      required
      aria-label="Note text"></textarea>
    <div class="composer-row">
      <span class="counter" id="counter">0 / {{ max_length }}</span>
      <button type="submit" class="btn-primary" id="save">Save note</button>
    </div>
    <p class="hint">Tip: press <strong>Ctrl</strong> + <strong>Enter</strong> to save.</p>
  </form>

  <div class="list-head">
    <h2>Saved notes</h2>
    <span id="count"></span>
  </div>

  <ul class="notes" id="notes"></ul>
  <div class="empty" id="empty" hidden>No notes yet. Your first note will show up here.</div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var form     = document.getElementById("form");
  var input    = document.getElementById("content");
  var counter  = document.getElementById("counter");
  var saveBtn  = document.getElementById("save");
  var notesEl  = document.getElementById("notes");
  var emptyEl  = document.getElementById("empty");
  var countEl  = document.getElementById("count");
  var toastEl  = document.getElementById("toast");
  var maxLen   = Number(input.getAttribute("maxlength")) || 2000;
  var toastTimer = null;

  // ---------- small helpers ----------
  function toast(message, isError) {
    toastEl.textContent = message;
    toastEl.className = "show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ""; }, 2600);
  }

  function when(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + " min ago";
    if (diff < 86400) return Math.floor(diff / 3600) + " hr ago";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) +
           " at " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function updateCounter() {
    var n = input.value.length;
    counter.textContent = n + " / " + maxLen;
    counter.className = "counter" + (n >= maxLen ? " over" : "");
  }

  // ---------- render one note ----------
  function noteItem(note) {
    var li = document.createElement("li");
    li.className = "note";
    li.dataset.id = note.id;

    var p = document.createElement("p");
    p.className = "note-text";
    p.textContent = note.content;          // textContent: no HTML injection

    var foot = document.createElement("div");
    foot.className = "note-foot";

    var stamp = document.createElement("span");
    stamp.className = "stamp";
    stamp.textContent = when(note.created_at);
    stamp.title = note.created_at;

    var actions = document.createElement("div");
    actions.className = "note-actions";

    var editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "btn-ghost";
    editBtn.textContent = "Edit";
    editBtn.addEventListener("click", function () { startEdit(li, note); });

    var delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "btn-ghost danger";
    delBtn.textContent = "Delete";
    delBtn.addEventListener("click", function () { removeNote(note.id); });

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    foot.appendChild(stamp);
    foot.appendChild(actions);
    li.appendChild(p);
    li.appendChild(foot);
    return li;
  }

  // ---------- inline edit ----------
  function startEdit(li, note) {
    if (li.querySelector("textarea")) return;

    var box = document.createElement("textarea");
    box.value = note.content;
    box.maxLength = maxLen;
    box.style.minHeight = "80px";

    var row = document.createElement("div");
    row.className = "composer-row";
    row.style.marginTop = "8px";

    var cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "btn-ghost";
    cancel.textContent = "Cancel";
    cancel.addEventListener("click", function () { render(currentNotes); });

    var save = document.createElement("button");
    save.type = "button";
    save.className = "btn-primary";
    save.textContent = "Update";
    save.style.padding = "6px 14px";
    save.style.fontSize = "14px";
    save.addEventListener("click", function () { submitEdit(note.id, box.value); });

    row.appendChild(cancel);
    row.appendChild(save);

    li.innerHTML = "";
    li.appendChild(box);
    li.appendChild(row);
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
  }

  async function submitEdit(id, text) {
    var content = text.trim();
    if (!content) { toast("Note cannot be empty.", true); return; }
    try {
      var res = await fetch("/api/notes/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: content })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not update the note.");
      toast("Note updated.");
      load();
    } catch (err) {
      toast(err.message, true);
    }
  }

  // ---------- delete ----------
  async function removeNote(id) {
    if (!confirm("Delete this note? This cannot be undone.")) return;
    try {
      var res = await fetch("/api/notes/" + id, { method: "DELETE" });
      if (!res.ok) {
        var data = await res.json().catch(function () { return {}; });
        throw new Error(data.error || "Could not delete the note.");
      }
      toast("Note deleted.");
      load();
    } catch (err) {
      toast(err.message, true);
    }
  }

  // ---------- load + render list ----------
  var currentNotes = [];

  function render(notes) {
    currentNotes = notes;
    notesEl.innerHTML = "";
    notes.forEach(function (note) { notesEl.appendChild(noteItem(note)); });
    emptyEl.hidden = notes.length > 0;
    countEl.textContent = notes.length
      ? notes.length + (notes.length === 1 ? " note" : " notes")
      : "";
  }

  async function load() {
    try {
      var res = await fetch("/api/notes");
      if (!res.ok) throw new Error("Could not load notes.");
      var data = await res.json();
      render(data.notes || []);
    } catch (err) {
      toast(err.message, true);
    }
  }

  // ---------- save ----------
  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    var content = input.value.trim();
    if (!content) { toast("Write something first.", true); input.focus(); return; }

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";
    try {
      var res = await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: content })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not save the note.");

      input.value = "";
      updateCounter();
      input.focus();
      render([data.note].concat(currentNotes));   // newest first, no refetch
      toast("Note saved.");
    } catch (err) {
      toast(err.message, true);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save note";
    }
  });

  input.addEventListener("input", updateCounter);

  input.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
      form.requestSubmit();
    }
  });

  // ---------- boot ----------
  updateCounter();
  load();
})();
</script>
</body>
</html>
